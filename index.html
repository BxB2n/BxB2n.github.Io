<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CCG Terminal</title>
<style>
:root{--bg:#000;--fg:#fff;--accent:#888;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Courier New',monospace;color:var(--fg);}
body{background:var(--bg);overflow:hidden;height:100vh;display:flex;}
/* ---------- LEFT ---------- */
#left{flex:1;padding:1rem;display:flex;flex-direction:column;}
header{text-align:center;margin-bottom:1rem;}
#clock{font-weight:bold;}
.status-bar{display:flex;justify-content:space-between;font-size:.75rem;border:1px solid var(--accent);padding:.3rem .5rem;margin-bottom:1rem;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;flex:1;overflow-y:auto;}
.card{border:1px solid var(--accent);padding:1rem;cursor:pointer;transition:border .2s;}
.card:hover{border-color:var(--fg);}
/* ---------- RIGHT (slide panel) ---------- */
#right{position:fixed;top:0;right:0;width:320px;height:100%;background:var(--bg);border-left:1px solid var(--accent);transform:translateX(100%);transition:transform .4s ease;display:flex;flex-direction:column;padding:1rem;}
#right.open{transform:translateX(0);}
#arrow{position:fixed;right:10px;top:50%;transform:translateY(-50%);width:30px;height:60px;background:var(--accent);clip-path:polygon(0 0,100% 50%,0 100%);cursor:pointer;transition:background .2s;}
#arrow:hover{background:var(--fg);}
body.panel-open #arrow{right:330px;}
/* ---------- SUB-MISSION MODAL ---------- */
#subModal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:10;}
#subModal.hidden{display:none;}
.subBox{background:var(--bg);border:1px solid var(--accent);width:90%;max-width:500px;padding:1rem;}
.subBox textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--accent);padding:.5rem;margin:.5rem 0;}
.subBox button{width:100%;padding:.5rem;margin-top:.25rem;background:var(--bg);border:1px solid var(--accent);cursor:pointer;}
.subBox button:hover{border-color:var(--fg);}
/* ---------- DEV ---------- */
#devIn{position:fixed;top:5px;right:5px;width:40px;background:var(--bg);border:1px solid var(--accent);padding:2px;font-size:.7rem;}
</style>
</head>
<body>
<!-- ========== LEFT ========== -->
<section id="left">
  <header>
    <h1>COMMISSION OF COUNTER GHOUL</h1>
    <div class="status-bar">
      <span>SECTOR: 20TH WARD</span>
      <span id="clock">--:--:--</span>
    </div>
  </header>

  <div class="cards" id="cards">
    <div class="card" data-cat="ghoul-hunting"><h3>🎯 Ghoul Hunting</h3><p>Track & eliminate.</p></div>
    <div class="card" data-cat="raids"><h3>⚡ Raids</h3><p>Strike nests.</p></div>
    <div class="card" data-cat="info"><h3>📊 Info</h3><p>Intel gathering.</p></div>
  </div>
</section>

<!-- ========== RIGHT PANEL (slide) ========== -->
<aside id="right">
  <h2>WEAPON / SKILL REQUESTS</h2>
  <div id="reqList" style="flex:1;overflow:auto;border:1px solid var(--accent);padding:.5rem;margin-bottom:.5rem;"></div>
  <input id="reqName" placeholder="Investigator ID" style="width:100%;margin-bottom:.5rem;padding:.3rem;background:var(--bg);border:1px solid var(--accent);">
  <textarea id="reqText" rows="3" placeholder="Request details..." style="width:100%;margin-bottom:.5rem;padding:.3rem;background:var(--bg);border:1px solid var(--accent);"></textarea>
  <button id="sendReq">SUBMIT REQUEST</button>
</aside>

<div id="arrow"></div>

<!-- ========== SUB-MISSION MODAL ========== -->
<div id="subModal" class="hidden">
  <div class="subBox">
    <h3 id="subTitle"></h3>
    <textarea id="subBody"></textarea>
    <button id="subSave">SAVE</button><button id="subClose">CLOSE</button>
  </div>
</div>

<input id="devIn" maxlength="3" placeholder="DEV">

<!-- ========== FIREBASE ========== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

const firebaseConfig = {
  /* ← put your config object here */
  apiKey: "YOUR",
  authDomain: "YOUR",
  databaseURL: "YOUR",
  projectId: "YOUR",
  storageBucket: "YOUR",
  messagingSenderId: "YOUR",
  appId: "YOUR"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const requestsRef = ref(db, 'requests');
const subRef = ref(db, 'subMissions');

/* ----- CLOCK ----- */
function updateClock() {
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('en-GB');
}
setInterval(updateClock, 1000);
updateClock();

/* ----- PANEL SLIDE ----- */
const arrow = document.getElementById('arrow');
const right = document.getElementById('right');
arrow.onclick = () => {
  right.classList.toggle('open');
  document.body.classList.toggle('panel-open');
};

/* ----- REQUESTS (live) ----- */
onValue(requestsRef, snap => {
  const box = document.getElementById('reqList');
  box.innerHTML = '';
  snap.forEach(ch => {
    const r = ch.val();
    const div = document.createElement('div');
    div.style.marginBottom = '.5rem';div.style.borderLeft = '2px solid var(--accent)';div.style.paddingLeft = '.3rem';
    div.innerHTML = `<strong>${r.name} – ${r.type}</strong><div style="font-size:.75rem;color:var(--accent)">${r.text}</div>${r.resp?`<div style="font-size:.75rem;color:#aaa">RESP: ${r.resp}</div>`:''}`;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
});

document.getElementById('sendReq').onclick = () => {
  const name = document.getElementById('reqName').value.trim();
  const text = document.getElementById('reqText').value.trim();
  if (!name || !text) return;
  push(requestsRef, { name, text, type: 'weapon', resp: '', time: Date.now() });
  document.getElementById('reqText').value = '';
};

/* ----- DEV MODE ----- */
let devMode = false;
document.getElementById('devIn').addEventListener('input', e => {
  if (e.target.value.toUpperCase() === 'DEV') {
    devMode = true;
    e.target.value = '';
    alert('DEV on – click any main card to add sub-mission');
  }
});

/* ----- SUB-MISSIONS ----- */
let currentCat = null;
document.querySelectorAll('.card[data-cat]').forEach(c => {
  c.addEventListener('click', () => {
    if (!devMode) return;
    currentCat = c.dataset.cat;
    document.getElementById('subTitle').textContent = `Add sub-mission to ${currentCat}`;
    document.getElementById('subBody').value = '';
    document.getElementById('subModal').classList.remove('hidden');
  });
});

document.getElementById('subSave').onclick = () => {
  const body = document.getElementById('subBody').value.trim();
  if (body && currentCat) {
    push(subRef, { cat: currentCat, body, time: Date.now() });
    document.getElementById('subModal').classList.add('hidden');
  }
};
document.getElementById('subClose').onclick = () => {
  document.getElementById('subModal').classList.add('hidden');
};

/* ----- DISPLAY SUB-MISSIONS ----- */
onValue(subRef, snap => {
  const container = document.getElementById('cards');
  container.querySelectorAll('.sub-card').forEach(sc => sc.remove());
  snap.forEach(ch => {
    const m = ch.val();
    const div = document.createElement('div');
    div.className = 'card sub-card';
    div.innerHTML = `<h3>▸ ${m.cat.replace('-',' ')}</h3><p>${m.body}</p>`;
    container.appendChild(div);
  });
});
</script>
</body>
</html>
